name: Deploy site and docs

# Builds marketing pages + MkDocs Material into one artifact and deploys via
# GitHub Pages (Actions). After merge, set:
#   Settings → Pages → Source: GitHub Actions
# (one-time). Keeps https://yeetngreet.app/ (marketing) and /docs/ (MkDocs).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build MkDocs into _site/docs
        run: mkdocs build --site-dir _site/docs

      - name: Assemble marketing root into _site
        run: |
          set -euo pipefail
          # Root marketing (do not overwrite _site/docs)
          for f in index.html privacy.html styles.css CNAME .nojekyll \
                   favicon.ico favicon-32.png apple-touch-icon.png logo.png docs.html; do
            if [ -f "$f" ]; then
              cp "$f" "_site/$f"
            fi
          done
          # Ensure docs directory URL works without trailing issues
          test -f _site/docs/index.html
          ls -la _site | head
          ls -la _site/docs | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
