name: publish-host-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Host version without v prefix (e.g. 0.5.54)"
        required: true
        type: string
      yeetngreet_run_id:
        description: "Successful build-host run id on darrenbell09/yeetngreet"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download host artifact from yeetngreet
        env:
          GH_TOKEN: ${{ secrets.YEETNGREET_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Set repo secret YEETNGREET_READ_TOKEN (PAT/fine-grained with Actions read on darrenbell09/yeetngreet)." >&2
            exit 1
          fi
          gh run download "${{ inputs.yeetngreet_run_id }}" \
            -R darrenbell09/yeetngreet \
            -n yeetngreet-host \
            -D .
          test -f YeetnGreet.exe
          ls -la YeetnGreet.exe
          sha256sum YeetnGreet.exe

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          SIZE=$(wc -c < YeetnGreet.exe | tr -d ' ')
          SHA=$(sha256sum YeetnGreet.exe | awk '{print $1}')
          NOTES=$(printf '%s\n' \
            "## YeetnGreet v${VERSION}" \
            "" \
            "Host build for in-app updates (asset YeetnGreet.exe)." \
            "" \
            "**SHA256:** \`${SHA}\`" \
            "**Size:** ${SIZE} bytes" \
            "**CI run (yeetngreet):** ${{ inputs.yeetngreet_run_id }}")
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" YeetnGreet.exe -R "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" YeetnGreet.exe \
              -R "${{ github.repository }}" \
              --title "YeetnGreet v${VERSION}" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" -R "${{ github.repository }}"
