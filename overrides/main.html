{% extends "base.html" %}

{% block extrahead %}
  <script>
    (function () {
      var t = localStorage.getItem("yeetngreet-site-theme");
      document.documentElement.setAttribute(
        "data-theme",
        t === "dark" || t === "light" ? t : "light"
      );
    })();
  </script>
{% endblock %}

{% block fonts %}
  {# Marketing fonts — same stack as yeetngreet.app (styles.css) #}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --md-text-font: "IBM Plex Sans", "Segoe UI", sans-serif;
      --md-code-font: "IBM Plex Mono", ui-monospace, monospace;
    }
  </style>
{% endblock %}

{% block styles %}
  {{ super() }}
  {# Source of truth: marketing styles.css (copied into the docs site via hooks.py) #}
  <link rel="stylesheet" href="{{ 'styles.css' | url }}" />
{% endblock %}
