site_name: YeetnGreet
site_description: Onboard and offboard Microsoft 365 for IT admins — from your technicians' PCs.
site_url: https://yeetngreet.app/docs/
site_author: YeetnGreet
docs_dir: docsrc

copyright: Copyright &copy; YeetnGreet

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  palette:
    # Light first — match marketing site default
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

hooks:
  - hooks.py

extra_css:
  - assets/styles/extra.css

extra_javascript:
  - assets/javascripts/theme-sync.js

extra:
  generator: false
  homepage: https://yeetngreet.app/
  docs_home: https://yeetngreet.app/docs/
  pricing: https://yeetngreet.app/pricing.html
  privacy: https://yeetngreet.app/privacy.html
  founding: https://yeetngreet.app/pricing.html#founding

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Admin permissions: getting-started/permissions.md
      - First run: getting-started/first-run.md
  - Jobs:
      - Offboard: jobs/offboard.md
      - Onboard: jobs/onboard.md
      - Schedules: jobs/schedules.md
  - Reports:
      - Overview: reports/overview.md
      - License audit: reports/license-audit.md
      - Unused licenses: reports/unused-licenses.md
      - What-if savings: reports/what-if.md
      - Delivery: reports/delivery.md
      - Samples: reports/samples.md
  - Tenants:
      - Multi-tenant: tenants/multi-tenant.md
      - Hybrid AD: tenants/hybrid-ad.md
  - Pricing and licensing: pricing-and-licensing.md
  - Privacy: privacy.md
  - Support: support.md
